name: Release on tag

# Auto-create a GitHub Release whenever a vX.Y.Z tag is pushed.
# Uses the built-in GITHUB_TOKEN — no manual `gh auth login` / npm login needed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:           # manual run to backfill an existing tag
    inputs:
      tag:
        description: 'Existing tag to create a Release for (e.g. v1.2.0)'
        required: true

permissions:
  contents: write              # required for gh release create/edit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section from README
        run: |
          TAG='${{ steps.tag.outputs.name }}'
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ ("^### `v" ver "`") { flag=1; next }
            flag && /^### `v/ { flag=0 }
            flag { print }
          ' README.md > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.tag.outputs.name }}'
          if [ -s RELEASE_NOTES.md ]; then
            NOTES=(--notes-file RELEASE_NOTES.md)
          else
            NOTES=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" "${NOTES[@]}"
          else
            gh release create "$TAG" --title "$TAG" --verify-tag "${NOTES[@]}"
          fi

  publish-npm:
    # Only on a real tag push (not manual backfill of an old tag).
    # Requires repo secret NPM_TOKEN = an npm Automation token (bypasses 2FA).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # enables npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Guard — tag must match package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG — bump package.json before tagging."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
