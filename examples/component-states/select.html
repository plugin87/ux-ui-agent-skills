<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Select & Combobox - verified</title>
<link rel="stylesheet" href="../brandkit-demo/theme.css" />
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font-sans);background:var(--color-surface-page);color:var(--color-text-primary);padding:var(--space-6)}
  h1{font-size:var(--text-2xl);margin-bottom:var(--space-4)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:var(--space-6);align-items:start}
  .cell{padding:var(--space-4);border:1px solid var(--color-border-default);border-radius:var(--radius-card);background:var(--color-surface-card)}
  .field{display:grid;gap:var(--space-2)}
  .label{font-size:var(--text-sm);font-weight:500}
  /* wrapper holds the control + a standard chevron that adapts to the theme */
  .wrap{position:relative;display:flex;align-items:center}
  .control{height:var(--size-control-md);padding-inline:var(--space-3);padding-inline-end:var(--space-8);inline-size:100%;
    border:1px solid var(--color-border-strong);border-radius:var(--radius-button);
    background:var(--color-surface-page);color:var(--color-text-primary);font-size:var(--text-base)}
  select.control{appearance:none;-webkit-appearance:none}
  select.control:disabled{opacity:.5}
  .control:focus-visible{outline:none;box-shadow:var(--shadow-focus-ring);border-color:var(--color-action-primary)}
  .chev{position:absolute;inset-inline-end:var(--space-3);inline-size:1rem;block-size:1rem;pointer-events:none;color:var(--color-text-secondary)}
  /* listbox - no bullets, no default list padding */
  .listbox{list-style:none;margin:var(--space-2) 0 0;padding:0;border:1px solid var(--color-border-default);
    border-radius:var(--radius-button);background:var(--color-surface-card);box-shadow:var(--shadow-md);overflow:hidden}
  .opt{padding:var(--space-3);font-size:var(--text-base);cursor:pointer}
  .opt:hover{background:var(--color-surface-raised)}
  .opt[aria-selected="true"]{background:var(--color-surface-raised);font-weight:600}
</style>
</head>
<body>
<h1>Select &amp; Combobox</h1>
<div class="grid">

  <div class="cell"><div class="field">
    <label class="label" for="s1">Native select · default</label>
    <div class="wrap">
      <select class="control" id="s1"><option>United States</option><option>Thailand</option><option>Japan</option></select>
      <svg class="chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </div>
  </div></div>

  <div class="cell"><div class="field">
    <label class="label" for="s2">Native select · disabled</label>
    <div class="wrap">
      <select class="control" id="s2" disabled><option>United States</option></select>
      <svg class="chev" aria-hidden="true" style="opacity:.5"><use href="#i-chevron-down"/></svg>
    </div>
  </div></div>

  <div class="cell"><div class="field">
    <label class="label" for="c1">Combobox · collapsed</label>
    <div class="wrap">
      <input class="control" id="c1" role="combobox" aria-expanded="false" aria-controls="c1list" aria-autocomplete="list" value="Thailand" />
      <svg class="chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </div>
  </div></div>

  <div class="cell"><div class="field">
    <label class="label" for="c2">Combobox · expanded</label>
    <div class="wrap">
      <input class="control" id="c2" role="combobox" aria-expanded="true" aria-controls="c2list" aria-activedescendant="c2o2" aria-autocomplete="list" value="Th" />
      <svg class="chev" aria-hidden="true" style="transform:rotate(180deg)"><use href="#i-chevron-down"/></svg>
    </div>
    <ul class="listbox" role="listbox" id="c2list" aria-label="Countries">
      <li class="opt" role="option" id="c2o1">Thailand</li>
      <li class="opt" role="option" id="c2o2" aria-selected="true">The Netherlands</li>
      <li class="opt" role="option" id="c2o3">Thuringia</li>
    </ul>
  </div></div>

</div>
<script src="icons.js"></script>
<script>
  /* Combobox keyboard model (WAI-ARIA): focus stays on the input and the arrows
     move aria-activedescendant, so a screen reader announces the active option
     without the input losing focus. Enter commits, Escape collapses. */
  const box=document.getElementById('c2');
  const opts=[...document.querySelectorAll('#c2list .opt')];
  function activate(i){
    const next=opts[(i+opts.length)%opts.length];
    opts.forEach(o=>o.setAttribute('aria-selected',String(o===next)));
    box.setAttribute('aria-activedescendant',next.id);
    next.scrollIntoView({block:'nearest'});
  }
  box.addEventListener('keydown',e=>{
    const i=opts.findIndex(o=>o.id===box.getAttribute('aria-activedescendant'));
    if(e.key==='ArrowDown'){e.preventDefault();activate(i+1);}
    else if(e.key==='ArrowUp'){e.preventDefault();activate(i-1);}
    else if(e.key==='Home'){e.preventDefault();activate(0);}
    else if(e.key==='End'){e.preventDefault();activate(opts.length-1);}
    else if(e.key==='Enter'&&opts[i]){e.preventDefault();box.value=opts[i].textContent;}
    else if(e.key==='Escape'){box.setAttribute('aria-expanded','false');}
  });
  opts.forEach((o,i)=>o.addEventListener('click',()=>{activate(i);box.value=o.textContent;box.focus();}));
</script>
</body>
</html>
