<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>clipped overflow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The page hides its sideways scrollbar instead of fitting: the key is
     still wider than a 280px screen, the reader just cannot scroll to the
     end of it. With the clip on html as well as body, body becomes the
     scroller and the document reports no overflow at all. */
  html, body { overflow-x:hidden; }
  body { margin:0; background:#ffffff; color:#1d1d1f; font:16px/1.5 system-ui, sans-serif; }
  main { padding:24px; }
  .key { font-family: ui-monospace, monospace; }
</style></head>
<body><main>
  <h1>API key</h1>
  <p class="key">sk-live-8fd2c41a9b7e05236cd18af49b7e0523aa61c9d4f80b2e77</p>
</main></body></html>
