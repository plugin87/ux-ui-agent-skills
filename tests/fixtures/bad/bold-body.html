<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>no display type</title>
<style>
  body { margin:0; background:#ffffff; color:#1d1d1f; font:16px/1.5 system-ui, sans-serif; }
  main { padding:24px; max-inline-size:65ch; }
  /* 24px over a 16px body is 1.5x: bold body text, not display type. */
  h1 { font-size:24px; font-weight:700; margin:0 0 16px; }
  h2 { font-size:20px; font-weight:600; }
</style></head>
<body><main>
  <h1>Account overview</h1>
  <p>Your plan renews on the first of next month and includes ten seats.</p>
  <h2>Usage</h2>
  <p>You have used six of your ten seats so far this billing period.</p>
</main></body></html>
