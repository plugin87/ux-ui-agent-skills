<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a large box carrying almost nothing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --color-surface-page:#fff; --color-surface-raised:#f4f4f6;
          --color-text-primary:#1d1d1f; --color-border-subtle:#c9c9d0;
          --radius-lg:20px; --space-4:16px; --space-6:24px; }
  * { box-sizing:border-box; } html,body { margin:0; }
  body { background:var(--color-surface-page); color:var(--color-text-primary);
         font:16px/1.5 system-ui,sans-serif; }
  main { padding:var(--space-4); }
  h1 { font-size:42px; line-height:1.1; margin:0 0 var(--space-4); }
</style></head>
<body><main>
<h1>Plan</h1>
<p><button type="button">Choose</button></p>
<div style="background:var(--color-surface-raised); border:1px solid var(--color-border-subtle); border-radius:var(--radius-lg); padding:var(--space-6); block-size:70vh"><span style="font-size:13px">Pro</span></div>
</main></body></html>
