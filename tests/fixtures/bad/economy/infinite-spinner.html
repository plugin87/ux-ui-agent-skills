<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>decoration that animates forever</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --color-surface-page:#fff; --color-surface-raised:#f4f4f6;
          --color-text-primary:#1d1d1f; --color-border-subtle:#c9c9d0;
          --radius-lg:20px; --space-4:16px; --space-6:24px; }
  * { box-sizing:border-box; } html,body { margin:0; }
  body { background:var(--color-surface-page); color:var(--color-text-primary);
         font:16px/1.5 system-ui,sans-serif; }
  main { padding:var(--space-4); }
  h1 { font-size:42px; line-height:1.1; margin:0 0 var(--space-4); }
</style></head>
<body><main>
<style>@keyframes spin{to{transform:rotate(360deg)}}.deco{inline-size:48px;block-size:48px;border-radius:50%;border:4px solid var(--color-border-subtle);border-block-start-color:#555;animation:spin 1s linear infinite}</style>
<h1>Dashboard</h1>
<p><button type="button">Refresh</button></p>
<div class="deco" aria-hidden="true"></div>
</main></body></html>
