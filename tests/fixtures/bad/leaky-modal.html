<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>leaky modal</title>
<style>
  body { margin:0; background:#ffffff; color:#1d1d1f; font:16px/1.5 system-ui, sans-serif; }
  main { padding:24px; }
  .btn { min-height:44px; padding:10px 16px; border:1px solid #6b6b70; background:#ffffff;
         border-radius:8px; font:inherit; color:#1d1d1f; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; }
  .scrim[data-open="true"] { display:grid; place-items:center; }
  .dialog { background:#ffffff; padding:24px; border-radius:12px; inline-size:min(400px, 90vw); }
</style></head>
<body>
<main>
  <h1>Members</h1>
  <button type="button" class="btn" id="openBtn">Remove member</button>
  <button type="button" class="btn" id="afterBtn">Unrelated action</button>
</main>
<div class="scrim" id="scrim">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle">Remove member</h2>
    <p>They lose access immediately.</p>
    <button type="button" class="btn" id="cancelBtn">Cancel</button>
    <button type="button" class="btn" id="confirmBtn">Remove</button>
  </div>
</div>
<script>
  // No focus trap, no Escape handler, no focus return: Tab walks straight out
  // of the dialog into the page behind it.
  document.getElementById('openBtn').addEventListener('click', () => {
    document.getElementById('scrim').setAttribute('data-open', 'true');
    document.getElementById('cancelBtn').focus();
  });
</script>
</body></html>
