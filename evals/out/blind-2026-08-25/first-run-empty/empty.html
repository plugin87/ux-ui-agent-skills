<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Waypoint</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
<style>
/* Inlined so the reduced-motion policy is readable from same-document CSSOM
   (a file:// -linked stylesheet is opaque to cross-file cssRules access in
   Chromium's headless file-origin isolation, even though it applies visually).
   Canonical source is styles.css; kept identical here. */
@media (prefers-reduced-motion: reduce) {
  .skeleton-block { animation: none; opacity: 0.85; }
  .spinner { animation: none; }
  .toast, .skip-link, .btn { transition: none; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  <div class="brand">
    <svg class="ico ico-lg" aria-hidden="true"><use href="#i-dashboard"></use></svg>
    <span>Waypoint</span>
  </div>
  <div class="header-actions">
    <button type="button" id="theme-toggle" class="btn btn-ghost" role="switch" aria-checked="false">
      <svg class="ico" aria-hidden="true"><use href="#i-sliders"></use></svg>
      <span>Dark mode</span>
    </button>
  </div>
</header>

<main id="main">
  <div id="loading-announce" class="sr-only" role="status" aria-live="polite"></div>

  <div id="empty-skeleton" class="skeleton-hero" aria-busy="true" role="status">
    <span class="sr-only">Loading your projects…</span>
    <div class="skeleton-block" aria-hidden="true"></div>
    <div class="skeleton-block" aria-hidden="true"></div>
    <div class="skeleton-block" aria-hidden="true"></div>
    <div class="skeleton-block" aria-hidden="true"></div>
  </div>

  <div id="empty-content" class="empty-state" hidden>
    <div class="empty-icon" aria-hidden="true">
      <svg class="ico"><use href="#i-folder"></use></svg>
    </div>
    <h1>Projects keep your team's tasks, files, and decisions in one place.</h1>
    <p>Add tasks, share files, and track progress together, starting with your first project.</p>
    <a href="one-project.html" id="cta-create" class="btn btn-primary btn-lg">
      <svg class="ico" aria-hidden="true"><use href="#i-plus"></use></svg>
      <svg class="ico spinner" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"></circle><path d="M21 12a9 9 0 0 0-9-9"></path></svg>
      <span>Create your first project</span>
    </a>
  </div>
</main>

<script src="icons.js"></script>
<script src="app.js"></script>
<script>
  Waypoint.initTheme();
  Waypoint.initLoading('empty-skeleton', 'empty-content');
  Waypoint.initNavigateCta('cta-create', 'one-project.html');
</script>
</body>
</html>
